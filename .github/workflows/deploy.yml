name: Build and deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 9 8 * *" # monthly, on the 8th (FIPE publishes the new table in the first days of the month)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # the very first run downloads ~5,000 FIPE prices (~2 h)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: npm ci
      # Every FIPE price of a past month is immutable and cached forever here, so
      # after the first run only the new month is downloaded.
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
