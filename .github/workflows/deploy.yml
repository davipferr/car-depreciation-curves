name: Build and deploy

# FIPE answers 403 Forbidden to GitHub Actions runners, so this workflow never
# downloads data: it builds the site offline from the API responses committed in
# data_cache/. To refresh the data, run `npm run build` locally, commit
# data_cache/ and push.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CDC_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: npm ci
      - run: npm run build
      # Compare this build's data manifest with the one currently live and report
      # changes in the job summary; large drops (e.g. a family whose FIPE names no
      # longer match its regex) show up as warnings. Add --strict to the compare
      # command to block the deploy instead.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Compare data with the live site
        run: |
          curl -fsSL "${{ steps.pages.outputs.base_url }}/manifest.json" -o previous-manifest.json || echo "No live manifest yet"
          uv run python -m pipeline.manifest compare previous-manifest.json dist/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
